- title: Evaluation of the Mobility Action Programme (MAP)
  authors: Wilson J, Wilson R, Abbott JH, Wilson R, Stevenson B, Carter M, Kayem Y
  abstract: |
    The Mobility Action Programme (MAP) was developed by the Ministry of
    Health, and was designed to align with best practice approaches to early intervention
    programmes for MSK conditions and the five themes of the New Zealand Health Strategy.
    The MAP aimed to deliver evidence informed, community-based, multidisciplinary
    interventions for adults with MSK conditions. It intended to support people to
    access advice, assessment and treatment earlier than had previously been available.
    The MAP’s priority groups were Māori, Pasifika and individuals living in the highest
    deprivation quintile. The programme ran from May 2016 to December 2019. During
    this time, 4,783 individuals participated in the programme.

    This evaluation
    examined the effectiveness and impact of the MAP across six domains or evaluation
    criteria. These are: (1) health outcomes; (2) reach; (3) reduction in disparities;
    (4) economic impact; (5) consumer experience; and (6) what ‘works best’. The following
    key evaluation questions (KEQs) are framed around these criteria.

    The evaluation
    provides strong evidence that the MAP is an effective early intervention programme
    for people with MSK conditions. The MAP has resulted in health outcome gains for
    its participants, with the priority population groups achieving similar or better
    improvements in health status. The evaluation has also demonstrated that the programme
    is a prudent investment, with evidence showing it was cost-effective over the
    short-term, achieving estimated health gains of 155 QALYs in the MAP cohort, and
    INMB of \$5.4 million. The MAP is projected to be highly cost-effective over a
    five-year horizon. The evaluation concludes that investment in early intervention
    programmes for MSK conditions represents value for money. The specific focus of
    the MAP on priority groups contributes to health equity for Māori, Pasifika and
    those living in areas of higher derivation.
  source: Allen + Clarke, Wellington
  date: 2021-11-29
  url: https://www.health.govt.nz/publications/evaluation-of-the-mobility-action-programme-map
