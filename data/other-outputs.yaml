- title:
    "Health system and societal costs following osteoarthritis diagnosis in primary
    care: a population-based matched cohort study"
  authors:
    Wilson R, Pryymachenko Y, Schofield S, Shrestha R, Darlow B, Dowell T,
    MacRae J, Bell R, Abbott JH
  abstract: |
    *Objective*
    To estimate the incremental public healthcare utilisation
    and costs, incidence of comorbid conditions, and socioeconomic outcomes following
    newly diagnosed osteoarthritis in primary care in New Zealand.

    *Design*
    Matched
    longitudinal cohort study using routinely collected administrative data from the
    New Zealand Integrated Data Infrastructure. Patients with a first diagnosis of
    hip or knee osteoarthritis between 2009 and 2010 were identified from primary
    care electronic health records and matched with patients without osteoarthritis
    diagnosis across a large set of pre-diagnosis variables. Extensive diagnostic
    checking was undertaken to establish a very close balance of covariates between
    matched osteoarthritis and non-osteoarthritis cohorts. Healthcare utilisation,
    healthcare costs, incidence of comorbid health conditions, income and employment,
    receipt of social welfare benefits, and mortality were measured in administrative
    record data over 10-year follow-up and compared between the osteoarthritis and
    matched non-osteoarthritis cohorts by linear regression.

    *Results*
    We successfully
    matched 792 patients with newly diagnosed osteoarthritis with 35 904 controls
    without osteoarthritis diagnosis. The matched case and control cohorts were very
    well balanced across all baseline covariates. Compared with matched controls,
    osteoarthritis patients had significantly higher healthcare utilisation and healthcare
    costs over the 10 years following diagnosis, with total incremental public healthcare
    costs of \$10 771 (95% CI: 3 047, 18 494) per patient. There was no consistent
    evidence of differences in socioeconomic outcomes, mortality, or incidence of
    comorbid conditions.

    *Conclusions*
    People with osteoarthritis incur substantial
    healthcare costs in the decade following primary care diagnosis.
  source: OSF
  date: 2024-04-19
  doi: 10.17605/osf.io/8b39f
- title:
    "The long-term effects of opioid use before joint replacement surgery: A
    dose-response trial emulation with New Zealand linked register data. Analysis
    plan"
  authors: Pryymachenko Y, Wilson R, Abbott JH, Choong P, Dowsey M
  abstract: |
    Osteoarthritis (OA) is a common chronic health condition, affecting more
    than 500 million people worldwide in 2019. Opioids are commonly used to manage
    pain associated with OA, and their use is usually the highest before a total joint
    replacement (TJR) surgery due to more severe joint pain. However, patients receiving
    opioids before surgery respond worse to pain relief following surgery, have higher
    risk of surgical complications, revision surgery, and prolonged opioid use post-surgery.
    Pre-TJR opioid use also negatively affects long-term health and socio-economic
    outcomes. Although the need to minimize pre-surgery opioid use is evident, it
    has proven to be challenging.

    While opioids are still widely used for pre-TJR
    pain management, and particularly for patients with medical contraindications
    of nonopioid alternatives, it is important to establish the level of opioid use
    at which their negative effect manifests itself (if such a level exists). The
    aim of this study is to investigate the dose-response relationship between pre-TJR
    opioid use and long-term health and socio-economic outcomes.
  source: OSF
  date: 2023-09-08
  doi: 10.17605/osf.io/g52kt
- title:
    "The health system and societal costs of osteoarthritis in New Zealand: Methodology
    and results of the process for funding an optimal matching model"
  authors: Wilson R, Abbott JH, Pryymachenko Y
  abstract: |
    *Background*
    Diagnosis and first-line management of osteoarthritis (OA)
    typically occur in primary care, with surgical management (joint replacement surgery)
    reserved for those with more severe late-stage disease. Despite this, there is
    a lack of data available on the outcomes of OA managed in primary care (in contrast
    to a wealth of data on surgical outcomes). This report describes the methodology
    for a matched cohort analysis to estimate the outcomes of OA diagnosed in primary
    care settings and presents results of the process to find optimal matching models
    for this analysis. (Analysis of outcomes, using the matched cohorts identified
    here, will be reported subsequently.)

    *Method*
    A cohort of individuals enrolled
    with one regional primary healthcare organisation in New Zealand (NZ) was linked
    with the Integrated Data Infrastructure (IDI), a linked research database maintained
    by Statistics NZ containing data from government administrative datasets, Statistics
    New Zealand surveys and data collections, and non-governmental organisations.
    OA cases were defined as individuals having a first recorded onset of OA in the
    primary healthcare records in the period January 2009#sym.dash.en;December 2010;
    potential controls were drawn from all individuals enrolled with the primary healthcare
    organisation with no recorded diagnosis of OA during or prior to December 2010.
    Data on healthcare utilisation and costs, socioeconomic status, and other personal
    characteristics were extracted from existing datasets within the IDI. Separate
    cohorts were identified with (1) hip OA, (2) knee OA, and (3) either hip or knee
    OA. For each cohort, matching models were developed to identify, from the pool
    of potential controls without the corresponding OA diagnosis, a matched sample
    who were as similar are possible, across a large selection of baseline covariates,
    to those with an OA diagnosis. Optimal models were chosen based on diagnostic
    balance statistics (standardised mean difference, variance ratio), graphical inspection
    of the covariate distributions in the matched case and control groups, and any
    exclusion of cases by the matching models. Separate subgroup analyses were conducted
    for cohorts stratified by sex, ethnicity, and socioeconomic deprivation.

    *Results*
    Very good quality of matching was achieved for all three OA diagnosis cohorts
    and for all subgroups. Excellent balance was achieved across all 40 measured baseline
    covariates (standardised mean difference less than 0.1 (in absolute value), variance
    ratio between 0.8 and 1.25, and minimal observable difference in variable density
    plots) in the optimal models for all cohort and subgroups, with few unmatched
    observations (1–2% in each cohort, with the exception of the (small) Māori subgroup
    at 6–8%).

    *Conclusion*
    The matched cohorts identified here will be used to
    estimate the healthcare, personal, and socioeconomic burden of OA diagnosed and
    managed in primary care.
  source: FigShare
  date: 2023-07-05
  doi: 10.6084/m9.figshare.22661551.v3
- title:
    "Long-term outcomes of cruciate ligament injury: a revised matched cohort
    analysis of New Zealand linked register data. Analysis plan"
  authors: Pryymachenko Y, Wilson R, Abbott JH, Bell R
  abstract: |
    Cruciate ligament (CL) injuries  are serious and common  conditions.  However,  very
    little is known  on long-term  health and economic  effects of these injuries.  Our
    previous  study has investigated these effects for  New Zealand (NZ)  population  using  a
    rigorous  matching technique  (matching  individuals with a CL injury to similar
    individuals  without  a CL injury).  However, despite  controlling  for  a large
    set of baseline  characteristics aiming to capture individuals’ demographic, health,
    and socio-economic status to the extent that the effects on long-term  outcomes  would  only
    come from  the differences  in CL injury status, we came to the conclusion  that
    our  previous  results were likely driven  by unobserved differences  in physical
    activity levels, as people  who have a CL injury are likely to be more  active
    than people  who do not (e.g.  65% of ACL surgeries  in NZ are sports-related).  Therefore,  the
    current analysis aims at removing  these unobserved  differences  by using  a
    control group  with a similar activity level as the treatment group  to identify  the
    long-term  effects of CL injury.  This analysis plan details the methods  to be
    used in this research.
  source: OSF
  date: 2023-06-06
  doi: 10.17605/osf.io/9yu5r
- title:
    "Long-term outcomes of cruciate ligament injury: attempting a matched cohort
    analysis of New Zealand linked register data"
  authors: Pryymachenko Y,Wilson R, Abbott JH
  abstract: |
    *Background*
    Little is known on the long-term effects of cruciate ligament
    (CL) injuries. The present study aimed to investigate the effect of CL injuries
    on long-term health and socioeconomic outcomes in New Zealand using national-level
    observed data.

    *Method*
    We used a comprehensive linked database to identify
    the majority of CL injuries in New Zealand, and to find matched control cases
    based on a large set of covariates. Regression analyses were then performed to
    identify the long-term effects of CL injury.

    *Results*
    13#sym.space.nobreak.narrow;176
    CL injuries were identified during 2008#sym.dash.en;2009. CL injuries were associated
    with significantly increased healthcare utilization (number of hospitalizations,
    days spent in hospital, emergency department visits, medications dispensed) and
    costs within 10 years post-injury, as well as increased likelihood of having a
    total knee replacement or a subsequent CL injury. However, we also found that
    having a CL injury was also associated with improved socioeconomic outcomes and
    reduced mortality, which is surprising and may indicate bias due to unobserved
    differences in physical activity levels between the treatment and control groups.

    *Conclusions*
    We have concerns that the results of this study may be biased
    by unmeasured confounding. Further research, accounting for physical activity
    levels between individuals with and without a CL injury, is needed to establish
    the true effect of CL injury on long-term outcomes.
  source: OSF
  date: 2023-04-14
  doi: 10.17605/osf.io/zfuyg
- title:
    "The health system and societal costs of osteoarthritis in New Zealand: Analysis
    plan"
  authors: Wilson R, Abbott JH, Pryymachenko Y, Schofield S, Shrestha R
  abstract: |
    Osteoarthritis (OA) is among the most common chronic health conditions,
    causing a significant health and social burden. OA is typically diagnosed in primary
    care, and managed by general practitioners (GPs) during its clinical course for
    several years until, in many cases, need for eventual referral to an orthopaedic
    surgeon. Anecdotally, and in international data, it is recognised that management
    of OA falls well short of best practice; however, little systematic information
    is available on the burden or management of OA in primary care in New Zealand.

    This study forms part of a larger research project, funded by the Health Research
    Council of New Zealand (Project grant #18-442), to investigate the primary care
    management of OA in New Zealand, the health and socio-economic costs of OA across
    the whole course of the disease, and the potential gains from improving the delivery
    of care to meet best-practice standards.

    In this study, we will use osteoarthritis
    (OA) diagnosis data from primary care (extracted from patient records in the first
    phase of the project) and existing linked administrative data from the Ministry
    of Health and other government departments and agencies to investigate the health
    system and societal costs associated with knee and hip OA.

    This analysis plan details the data sources and variables, statistical
    methods, and outputs for this research.
  source: FigShare
  date: 2022-05-06
  doi: 10.6084/m9.figshare.16900156
- title:
    "The long-term impacts of opioid use before and after joint replacement surgery:
    Report on finding the optimal matching model"
  authors: "Pryymachenko Y, Wilson R, Abbott JH"
  abstract: |
    Total joint replacement (TJR) is one of the most common elective surgical
    procedures globally. While this surgery should provide patients with substantial,
    if not complete, pain relief from end-stage arthritis, post-surgical pain remains
    common. Opioids are part of the acute pain management strategy post-TJR. Long-term
    opioid use is not recommended due to substantial risk of harm, the diversion of
    prescription opioids for non-medical use, and the risk of overdose, injection-related
    harm, and dependence. However, use of opioids beyond the immediate post-surgical
    recovery period of TJR is widespread (e.g., 29 percent of hip replacement patients
    and 36 percent of knee replacement patients are prescribed opioids 3-12 months
    after surgery in New Zealand; similar numbers have also been reported in Australia
    and higher in the United States).

    One of the strongest risk factors of persistent
    postoperative opioid use is pre-and perioperative opioid use, which is also associated
    with several other adverse outcomes such as reduced pain relief following surgery,
    increased risk of surgical complications and early revision. However, there are
    no studies to date that look at broader economic, social, and healthcare outcomes
    of pre- and perioperative opioid use, either manifesting directly or through its
    effect on long-term opioid use.

    This project aims to identify the medium- to
    long-term health, economic, and social outcomes of pre- and perioperative opioid
    use in patients undergoing total hip and knee replacement surgery in New Zealand
    using the matching approach. The current document reports on the procedure and
    results of the first stage of the matching process – finding the optimal matching
    model. Performing and reporting on the matching procedure before undertaking outcome
    analysis is done to minimize the risk of bias due to low quality matching or selective
    reporting of models favourable to the expected outcomes. The analysis was pre-specified
    and published on the Open Science Framework.
  source: OUR Archive
  date: 2021-07-27
  url: https://hdl.handle.net/10523/12166
