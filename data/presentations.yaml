  stub: oarsi
  location: Toronto
  date: 2019-05-02
  title:
    "The cost-effectiveness of recommended adjunctive osteoarthritis management
    options: Results from a computer simulation model"
  note: poster presentation
  authors: Wilson R, Chua J, Briggs AM, Abbott JH
  published: _Osteoarthritis and Cartilage_ 2019;27(S1):S313
  doi: 10.1016/j.joca.2019.02.711
  abstract: |
    *Purpose*
    To estimate the cost-effectiveness, from the perspective of the New Zealand
    (NZ) healthcare system, of recommended adjunctive management options for
    knee osteoarthritis (OA), delivered in addition to core long-term
    management.

    *Methods*
    We have previously developed and validated a computer simulation model of
    the natural history, treatment, health-related quality of life (HRQoL)
    impacts, and healthcare costs of knee OA in the NZ population (the NZ-MOA
    model). The NZ-MOA model is a state-transition, microsimulation model of
    the population burden of knee OA in NZ. Within the model, individuals can
    develop radiographic OA (defined by Kellgren-Lawrence grade), experience
    HRQoL losses associated with OA, and undergo a sequence of treatments to
    alleviate the HRQoL losses associated with OA or slow structural
    progression of the disease. The model is run, for the same population
    cohort, for a comparator treatment sequence and then a modified treatment
    sequence including the new intervention(s) to be evaluated.
    Cost-effectiveness of the new intervention is calculated from the
    incremental lifetime QALYs gained and costs of the modified treatment
    sequence compared with the comparator.

    We used the NZ-MOA model to simulate the lifetime incremental QALY gains
    and healthcare costs incurred of nine adjunctive management options
    recommended by the 2018 Royal Australian College of General Practitioners
    (RACGP) OA clinical practice guideline (CPG): aquatic-based exercise,
    thermal therapy (heat pack), massage, assistive walking devices (walking
    cane), cognitive behavioural therapy, oral non-steroidal anti-inflammatory
    drugs (NSAIDs), topical NSAIDs, intra-articular corticosteroids, and
    duloxetine.

    The comparator treatment sequence consisted of “Core” management
    interventions for knee OA (i.e. self-management and education and
    land-based exercise, with weight management for overweight or obese
    individuals), recommended by the RACGP CPG for all patients, and total
    joint replacement (and possible revision surgery) for eligible patients
    progressing to end-stage OA. The intervention treatment sequences, modelled
    separately for each recommended intervention, added one of the nine
    recommended adjunctive management options to Core treatment, and before
    possible eligibility for joint replacement surgery.

    Treatment effect estimates and adverse events were sourced from the RACGP
    CPG and published systematic reviews. The primary HRQoL outcome was
    improvement in SF-6D utility value. In a sensitivity analysis, we modelled
    HRQoL based on the WOMAC pain subscale. Costs of treatment were calculated
    using a bottom-up approach, by multiplying the resource use required to
    provide each treatment by NZ reference prices for healthcare items and
    services.

    We calculated incremental costs and QALYs, incremental cost-effectiveness
    ratios (ICERs), and net monetary benefits (INBs) at willingness-to-pay
    (WTP) thresholds of one, two, and three times GDP per capita (\$52,300 in
    base year 2013) for each of the interventions.

    *Results*
    All adjunctive interventions were effective in increasing population
    lifetime QALYs relative to the Core treatment sequence (Table 1). Lifetime
    QALY gains for the 2013 population cohort varied from 15 600 QALYs for
    duloxetine to 54 600 QALYs for walking aids. Lifetime incremental costs
    ranged from -\$105 per capita (cost saving) for walking cane, to \$4 899 per
    capita for massage.

    Walking cane and oral NSAIDs dominated core treatment only, with higher
    lifetime QALYs and lower lifetime costs (due to reduced subsequent demand
    for joint replacement surgery). At the 1xGDP per capita WTP level, INBs
    were \$1 360 and \$473, respectively. Intra-articular corticosteroids were
    also cost-effective at the 1xGDP per capita WTP level, with INBs of \$470
    (Figure 1). Topical NSAIDs and cognitive behavioural therapy were
    cost-effective at the 2xGDP per capita level, and aquatic-based exercise
    became cost-effective at the 3xGDP level only. Duloxetine, thermal therapy,
    or massage were not cost-effective at any considered WTP levels. Using the
    WOMAC pain outcome did not change the overall cost-effectiveness findings
    (except for aquatic-based exercise, which was no longer cost-effective at
    3xGDP per capita).

    *Conclusions*
    Three of the nine recommended adjunctive interventions were found to be
    highly cost-effective from the NZ healthcare system perspective, and a
    further three were moderately cost-effective. In particular, low-cost,
    early interventions that reduce demand for subsequent high-cost treatments
    such as joint replacement surgery may realise substantial cost-savings over
    the life-course of people with knee OA. These interventions should be
    prioritised for further evaluation and consideration for more widespread
    utilization in the NZ health system.
- conference: OARSI World Congress
  stub: oarsi
  location: Toronto
  date: 2019-05-02
  title:
    "Integrating values and preferences with the best available evidence: A multi-criteria
    decision analysis approach"
  note: poster presentation
  authors: Chua J, Hansen P, Briggs AM, Wilson R, Gwynne-Jones DP, Abbott JH
  published: _Osteoarthritis and Cartilage_ 2019;27(S1):S308-9
  doi: 10.1016/j.joca.2019.02.705
  abstract: |
    *Purpose*
    Evidence-based practice requires that the best available evidence is
    integrated with patients’ individual values and preferences, and also with
    clinical expertise. Clinical practice guidelines (CPGs) provide
    recommendations for interventions using consensus-based approaches that
    generally involve weighing up the ‘best available evidence’, such as about
    harm and effectiveness. Typically, broad consumer and health provider
    engagement is constrained, and stakeholder preferences are not considered.
    Multi-criteria decision analysis (MCDA) methods are one way of bridging the
    gap between interpretation of evidence and stakeholders’ preferences. The
    aim of this study was to prioritise interventions for knee osteoarthritis
    (OA) in the early, mid and advanced stages of the disease in a MCDA
    framework.

    *Methods*
    We used a 3-stage process to evaluate OA interventions by matching
    stakeholder preferences for a discrete set of criteria, on which the
    interventions were evaluated, with the best available evidence for those
    criteria. Stage 1 involved determining the preference weights of 8
    criteria, established in earlier research, representing their relative
    importance to decision-makers: accessibility, cost of the intervention,
    duration of the intervention effect, effectiveness, quality of the evidence
    about the intervention, recommendation for using the intervention, risk of
    mild or moderate adverse effects, and risk of serious harm. Each criterion
    was defined by 2-4 levels describing the criterion’s best to worst
    performance. The criteria weights were quantified through a MCDA survey,
    using the online platform 1000minds.com, among a multi-disciplinary,
    cross-sectoral sample of key New Zealand (NZ) stakeholders. At stage 2, the
    performance of 75 interventions considered in the 2018 Royal Australian
    College of General Practitioners (RACGP) OA CPG was rated on the 8 criteria
    according to the defined levels. Performance was informed by the evidence
    tables reported in the RACGP OA CPG with incomplete data supplemented by a
    literature review and expert panel consensus. At stage 3, the total score
    for each intervention was calculated by summing the criterion preference
    weights associated with the rating determined in stage 2. Thus, the
    interventions were indirectly evaluated by matching stakeholder preferences
    (for the criteria) with the rating of the interventions on the criteria.
    The outcome of this 3-stage process were rankings of interventions for OA
    at each stage of the disease: early, mid and advanced. One-way sensitivity
    analyses explored the effect of a change in one level of a criterion on the
    total score of RACGP CPG recommendations for early, mid and advanced OA. An
    interactive web-page was developed to visualise the scores and rankings:
    the CMOR Evidence Table.

    *Results*
    The conjoint analysis survey was completed by 178 respondents (mean [SD]
    age 53 [13] years; 114 female): 63 consumers, 79 health care providers, 24
    policy-makers and 12 OA experts (16 [11] years relevant experience). Table
    1 shows the preference weights of the 8 criteria expressed as percentage
    points, where the maximum score (the sum of all criteria at their maximum
    level) is equal to 100%. Rankings of 75 interventions for early, mid and
    advanced OA were produced (Table 2). Of the 15 core intervention categories
    recommended by the RACGP OA CPG ‘all land-based exercise’ is ranked 1st
    (total score 74.6%) for early- and advanced-stage OA, but 2nd after topical
    NSAIDs (77.5%), for mid-stage OA. Self-management and education (43.0%) is
    ranked 15th at all stages of OA. Weight management (48.4%) is 11th for
    early- and mid-stage OA, and 12th for advanced OA. Total knee replacement
    (TKR) is 13th for early- and mid-stage OA, rising to 2nd (73.3%) place for
    advanced OA. Sensitivity analysis indicated the Effectiveness, Quality of
    Evidence, and Risk of Serious Harms criteria contribute most to score
    uncertainty.

    *Conclusions*
    MCDA was used to integrate best available evidence with key stakeholder
    values and preferences for knee OA interventions. The results suggest that
    not all core recommendations for OA interventions are strongly aligned with
    stakeholder preferences. Varying quality of the evidence about the
    effectiveness of the intervention or the risk of serious harm may confound
    the estimated total score of the interventions, and what constitutes a
    meaningful difference in scores between interventions is subject to
    interpretation. This method can enhance future implementation efforts by
    threading evidence and stakeholder preferences together in a transparent
    and robust process. The methods and preferences data may be applied to new
    evidence, and to evidence tables of other CPGs.
- conference: OARSI World Congress
  stub: oarsi
  location: Toronto
  date: 2019-05-02
  title:
    "Projecting the healthcare burden of knee osteoarthritis in New Zealand:
    Results from a computer simulation model"
  note: poster presentation
  authors: Abbott JH, Wilson R, Sullivan JK, Lenhard NK, Losina E
  published: _Osteoarthritis and Cartilage_ 2019;27(S1):S315
  doi: 10.1016/j.joca.2019.02.714
  abstract: |
    *Purpose*
    To forecast the demand for total knee replacement (TKR) surgery and total
    healthcare expenditure due to knee osteoarthritis (OA) in the New Zealand
    (NZ) population over the period 2013 to 2043.

    *Methods*
    We projected the incidence and progression of knee OA, utilization of TKR,
    and total knee OA-related healthcare expenditure in NZ over 30 years using
    the Osteoarthritis Policy (OAPol) model. The OAPol model is a
    computer-based, state-transition, Monte Carlo simulation model that can be
    used to estimate the projected rates of TKR, health loss, and healthcare
    spending associated with knee OA.The starting population cohorts in the
    model were defined by five-year age groups (from 25-29 years up to 75-79
    years, and 80 years and over), stratified by ethnicity (Māori or
    non-Māori), BMI (obese or non-obese), and sex, based on the 2013 NZ
    population distribution (Census data). Simulated individuals with knee OA
    pass through up to four regimens in the standard treatment sequence in the
    model: NSAIDs and physical therapy, corticosteroid injections, TKR, and
    revision TKR. Data for the costs and utilization of these treatment
    regimens were obtained from a variety of NZ and international sources. The
    rate at which patients were offered and accepted TKR was calibrated to TKR
    provision rates drawn from the New Zealand Joint Registry, by running the
    model for 5 years and varying the offer and acceptance rates to match
    actual provision for each cohort.The OAPol model was used to project the
    proportion of individuals receiving TKR and per-capita OA-related
    healthcare costs for each five-year period from 2013-2018 to 2038-2043,
    within the population cohorts stratified by age, sex, obesity, and
    ethnicity. These rates were then applied to projected population sizes,
    obtained from Statistics New Zealand population projections and
    previously-published projections of obesity prevalence rates, to forecast
    the total burden of OA in each five-year period. As the youngest (25-29
    years) cohort would be aged 50-54 at the start of the final (2038-2043)
    period, we have analysed TKR provision projections for those aged 50 years
    and over at the start of each period (to ensure an equivalent cohort in
    each period).

    *Results*
    The total provision of TKR was projected to increase rapidly from 5400 per
    year in 2013-2018 to 6800 per year in 2018-2023, and then more slowly to
    7300 per year in 2038-2043 (Figure 1). These increases largely reflected
    projected growth in the size of the older population, with the annual rate
    of TKR provision in those aged 50 years and over peaking at 410 per 100,000
    population in 2018-2023, before falling to 330 per 100,000 in 2038-2042.
    This trend occurs because the number of TKRs received by those with initial
    prevalent knee OA (at baseline) rapidly falls away after 2018-2023, as many
    people in this cohort are by then projected to have either already had a
    TKR or died.OA-related treatment costs were estimated to be NZ\$156 million
    per year in 2013-2018 (1 NZD ≈ 0.82 USD in 2013), and NZ\$8.0 billion (in
    present-value terms, discounted at 3% per annum) over the 30-year time
    horizon.After adjusting for differences in the baseline age distribution,
    Māori had a substantially higher burden of OA, in terms of both TKR
    utilization and OA healthcare costs (Figure 2).

    *Conclusions*
    Knee OA inflicts a growing cost to the NZ healthcare system. The projected
    rapid increase in demand for TKR over the next decade will require
    additional healthcare resources, to an environment in which the provision
    of joint replacement within the public healthcare sector is already
    constrained by capacity limitations.Our estimates of the treatment costs
    associated with OA, while substantial, represent underestimates of the true
    cost to the health system and society. Only costs associated with the four
    treatment regimens (NSAIDs and physical therapy, corticosteroid injections,
    TKR, and revision TKR) have been modelled, and only for the index knee (the
    model does not capture contralateral TKRs). Furthermore, indirect and
    non-healthcare costs (such as lost earnings, informal sector care, and
    community care) have not been considered. These projections indicate a need
    for a comprehensive national OA strategy in NZ to manage the demands that
    an ageing population, with increasing OA prevalence and obesity, will place
    on the NZ healthcare system.
