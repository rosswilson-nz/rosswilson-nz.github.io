  stub: oarsi
  location: Vienna
  date: 2024-08-18
  title:
    Health system and societal costs following osteoarthritis diagnosis in primary
    care
  note: poster presentation
  authors:
    Wilson R, Pryymachenko Y, Schofield D, Shrestha R, Darlow B, Dowell T,
    MacRae J, Abbott JH
  published: _Osteoarthritis Cartilage_ 2024;32(S1):S333
  doi: 10.1016/j.joca.2024.02.490
  abstract: |
    *Purpose (the aim of the study)*
    The aim of this study was to estimate the incremental public healthcare
    utilisation and costs, incidence of comorbid conditions, and socioeconomic
    outcomes following newly diagnosed osteoarthritis (OA) in primary care in
    New Zealand (NZ).

    *Methods*
    This was a matched longitudinal cohort study using routinely collected
    administrative data from the NZ Integrated Data Infrastructure (IDI), a
    linked research database containing individual-level data from government
    administrative datasets, Statistics NZ surveys and data collections, and
    non-governmental organisations. Patients with a first diagnosis of hip or
    knee OA between 2009 and 2010 were identified from primary care electronic
    health records.

    We used a propensity score matching approach to match each identified OA
    case with controls (patients without OA diagnosis) who were as similar as
    possible across a large set of pre-diagnosis variables. Extensive
    diagnostic checking was undertaken to assess the balance of covariates
    between the matched OA and non-OA cohorts, and the matching model
    iteratively improved to achieve optimal matching.

    Healthcare utilisation, healthcare costs, incidence of comorbid health
    conditions, income and employment, receipt of social welfare benefits, and
    mortality were measured in administrative record data over 10-year
    follow-up and compared between the OA and matched non-OA cohorts by linear
    regression. Sensitivity analyses were undertaken to assess the robustness
    of results to modelling assumptions, and analyses of population subgroups
    were conducted to assess differential outcomes by OA joint (hip or knee),
    ethnicity, sex, and socioeconomic deprivation.

    *Results*
    We successfully matched 792 patients with newly diagnosed OA (99% of
    identified OA cases) with 35 904 controls without OA diagnosis. The average
    age at diagnosis was 65 years, and 58% were female. The large majority of
    patients (91%) were of New Zealand European ethnicity, and 6% were Māori
    (New Zealand’s indigenous population). The distributions of all baseline
    covariates were very well balanced between the matched case and control
    cohorts (standardised mean difference < 0.1 and variance ratio < 1.25 for
    all covariates).

    Compared with matched controls, OA patients had significantly higher
    healthcare utilisation and healthcare costs over the 10 years following
    diagnosis. OA was associated with an average of 0.47 (95% CI: 0.09, 0.84)
    additional hospitalisations, 0.26 (95% CI: 0.21, 0.30) additional
    publicly-funded joint replacement surgeries, 8.9 (95% CI: 3.7, 14.2)
    additional outpatient clinic visits, and 0.32 (95% CI: 0.03, 0.61)
    additional emergency department visits; a 9.0 percentage point (95% CI:
    6.2, 11.9) increase in the likelihood of opioid prescribing and 6.9
    percentage point (95% CI: 4.1, 9.7) increase in NSAID prescribing; and
    total excess public healthcare costs of \$9 766 (95% CI: 2 720, 16 812) per
    patient. There was no consistent evidence of differences in socioeconomic
    outcomes, mortality, or incidence of comorbid conditions.

    The results were robust to variation in the selection of baseline
    covariates in the regression models, the estimation of generalised linear
    models instead of linear regression models, and excluding from the control
    group individuals who had a subsequent diagnosis of OA during the follow-up
    period.

    Subgroup differences in the effects of OA diagnosis were generally
    inconclusive, although some suggestive patterns were observed. The
    incremental impacts of hip OA diagnosis were larger than those of knee OA
    diagnosis for the likelihood of hospitalisation and joint replacement
    surgery, the number of emergency department visits, and the incidence of
    mental health conditions. The total public healthcare costs associated with
    OA diagnosis were smaller for Māori than for non-Māori patients, despite a
    higher rate of joint replacement surgery. The effects on utilisation of
    hospital services (but not other health services) and on incidence of
    cardiovascular disease were larger for men than for women. The rate of
    joint replacement surgery was higher for patients from more
    socioeconomically deprived areas.

    *Conclusions*
    This study provides estimates of the excess healthcare utilisation and
    costs following a diagnosis of hip or knee OA in primary care. We found
    substantial incremental healthcare use and costs attributable to OA
    diagnosis; however, there was little evidence of impacts on other health
    and economic outcomes.

    There was some evidence of inequities in access to care: both Māori and
    patients from more socioeconomically deprived areas had higher rates of
    publicly-funded joint replacement surgery, while Māori had lower overall
    public healthcare costs. These findings may reflect OA diagnosis coming at
    a later stage of disease progression for these populations, less access to
    early conservative care options, or less access to private insurance
    requiring a greater reliance on the public healthcare sector.
- conference: OARSI World Congress
  stub: oarsi
  location: Vienna
  date: 2024-08-18
  title:
    "Predictive models for identifying hip and knee osteoarthritis in primary
    care electronic records: a natural language processing text classifier approach"
  note: poster presentation
  authors: MacRae J, Darlow B, Dowell T, Stephenson C, Oscroft N, Wilson R, Abbott JH
  published: _Osteoarthritis Cartilage_ 2024;32(S1):S529
  doi: 10.1016/j.joca.2024.02.106
  abstract: |
    *Purpose (the aim of the study)*
    Osteoarthritis (OA) is a common condition affecting the hip and knee, and
    its accurate identification in populations is crucial for research and
    healthcare planning. This study aimed to apply Natural Language Processing
    (NLP) technology to identify, in primary care electronic health records
    (EHRs), diagnostic criteria that indicate probable cases of knee or hip OA.
    We hypothesized that a NLP text classifier algorithm could be developed to
    identify the key signs and symptoms of hip or kneeosteoarthritis (OA) from
    clinical narrative and coded data, and assign patients to a binary
    classification of either having OA or not. We compared the performance of
    different prediction models.

    *Methods*
    We accessed clinical records through a Primary Healthcare Organisation
    (PHO) in the lower North Island of Aotearoa New Zealand (NZ). 31 primary
    care practices consented access to deidentified EHR data.

    To develop the text classifier algorithm, two general medical practitioner
    (GP) clinical experts (coders) independently reviewed the longitudinal EHRs
    of 100 randomly-selected patients for signs and symptoms according to the
    ACR, EULAR or NICE clinical diagnostic criteria hip or knee OA. Using these
    coded case records, we trained and evaluated a NLP text classifier in an
    additional 1,579 patients. Bootstrapping with 1,000 replicates was used to
    generate samples for analysis.

    We evaluated the accuracy of four prediction models; 'single-keyword',
    'simple-keyword', 'text-classifier' and 'Read code', and report
    sensitivity, specificity, positive predictive value (PPV), negative
    predictive value (NPV), and Matthews correlation metrics of model
    performance.

    *Results*
    Usage-related joint pain was the most commonly identified diagnostic
    criterion (Figure). Most diagnostic signs and symptoms appeared rarely in
    the EHR narrative text, which posed challenges for specifying text
    classifier models or accurately identifying OA cases; combining the text
    classifiers for signs and symptoms we were not able to identify OA
    according to any of the classification criteria. The text classifier had
    lower sensitivity and NPV compared to the single keyword and simple keyword
    models.

    All of the models we evaluated were relatively insensitive, and thus risk
    missing 20 to 30% of hip OA cases and 5 to 60% of knee OA cases. We found
    Read-coded OA in slightly higher prevalence to GP identified OA. The PPV
    and specificity of the Read code-based approach were both 1.000 (95% CI
    1.000-1.000) – indicating that when a relevant OA Read code was present,
    the coders consistently identified the record as having OA - the NPV for
    the Read code-based model (0.940; 95% CI 0.884 to 0.988 for hip OA and
    0.935; 95% CI 0.879 to 0.978 for knee OA) was consistently higher that of
    the text-classifier approach (0.925; 95% CI 0.865 to 0.976 for hip OA and
    0.902; 95% CI 0.837 to 0.955 for knee OA), indicating lower prevalence of
    text-classifier identified OA than Read code identified OA within the
    cohort, and lower utility for identifiying people who do not have OA.

    We found an approach using Read codes augmented with additional brief
    free-text annotations provided the highest performance in identifying hip
    and knee OA cases, at a rate of.17 (95% CI.11 -.25) for hip OA and 0.16
    (95% CI 0.9 - 0.23) for knee OA.

    *Conclusions*
    Specifying a text-classifier algorithm using NLP for identifying patients
    with hip or knee OA was not feasible. The text-classifier approach had
    limitations in accurately classifying OA cases due to insufficient
    recording, in EHRs, of signs and symptoms necessary for inferring OA
    diagnoses according to classification criteria. Using Read codes plus
    free-text annotations was more effective than relying on clinical narrative
    data. These results imply that the current internationally endorsed
    diagnostic formulations of OA are either not the primary framework in which
    GPs identify or manage OA, or if so the findings are not recorded in the
    EHR. Diagnosis, coding, and the primary care framework of care are complex
    with interacting drivers of behaviour. These findings have implications for
    educational and training paradigms for both secondary and primary care, as
    well as for informing resource allocation issues.
- conference: OARSI World Congress
  stub: oarsi
  location: Vienna
  date: 2024-08-18
  title: The primary care diagnosis and management of osteoarthritis
  note: poster presentation
  authors: Abbott JH, Dowell T, MacRae J, Wilson R, Darlow B
  published: _Osteoarthritis Cartilage_ 2024; 32(S1):S73
  doi: 10.1016/j.joca.2024.02.786
  abstract: |
    *Purpose (the aim of the study)*
    Osteoarthritis (OA) is very common in adults, and its morbidity burden may
    begin during early- and mid-stage disease. Very little is known about
    patterns of healthcare encounters and utilization in New Zealand (NZ)
    primary care of people with OA.

    This project aimed to access and interrogate routinely collected patient
    encounter data in individual primary care electronic health records (EHRs)
    held by general medical/family practices in the lower North Island of NZ,
    identify cases and non-cases of hip or knee OA, and report the associated
    diagnosis, treatment, prescription and referral patterns.

    *Methods*
    In this retrospective observational cohort study, we defined a ten-year
    period extending from 1 Jan 2009 to 31 December 2018. From 31 participating
    practices, we accessed over 75 Million raw EHR entries including 7M
    diagnostic and clinical coding records (Read codes), 17M prescribing
    records and 20M encounter records. Matching between practice data sets was
    based on the NZ National Health Index (NHI) number. We included patients
    who met the following criteria: 1) adults aged 40 years or older, 2)
    enrolled at any practice for a 5-year contiguous period; and 3) had at
    least one recorded clinical note in the EHR during the study period.

    Demographics for date of birth, gender, ethnicity, date of death, and
    socioeconomic deprivation were based on the most recent enrolment register
    file available within the study period. We identified 79,861 eligible
    patients’ EHRs (683,060.25 patient-years of EHR data). We identified OA
    cases using Read codes augmented with free-text annotations (indicating hip
    or knee OA). We excluded cases with a general OA Read code not indicating
    hip or knee OA. Eligible patients with no OA Read code in the EHR were
    defined as non-cases of OA.

    We report age- and sex-matched comparisons of healthcare utilisation in
    primary care over the 10-year period following the recording of an OA
    diagnosis in primary care EHRs, and we linked these primary care data with
    the Statistics NZ Integrated Data Infrastructure (IDI) to also report
    hospital-based healthcare use (specialists appointments, outpatient
    physiotherapy, and joint replacement surgery) in the NZ public healthcare
    system in the 4 years before and after the recording of a hip or knee OA
    diagnosis in primary care EHRs.

    *Results*
    From an overall cohort of 69,663 adults in primary care, we identified 4599
    people with hip or knee OA (57.7% knee), mean age 65.8 (11.3), 56.5%
    female, 6.5% Māori (Indigenous people of NZ). After adjusting for NZ
    population demographics, the mean (95% CI) rate of hip or knee OA was 0.13
    (0.128 to 0.134). Māori had greater odds of OA diagnosis [around 1.3 (1.1
    to 1.6) across age bands].

    Age- and sex-matched comparisons showed significantly higher healthcare
    consumption in the OA group over the study period with increased primary
    care use, prescribing, hospital outpatient visits and surgery. People with
    a hip or knee OA Read code had 32% more primary care contacts than those
    without OA (135 vs 102).

    88.9% (88.0 to 90.4) of OA cases were dispensed NSAIDs compared with 72.1%
    of non-cases, with paracetamol and weak opiate rates similar. Strong
    opiates were dispensed to 21.6% (20.5 to 22.8) of OA cases, double that of
    the non-OA cohort. 39.3% of OA cases had a first specialist appointment in
    a public hospital; 24.1% having joint replacement surgery (compared with
    9.5%; 1.4% in non-cases). Outpatient physiotherapy was accessed by 47.8%
    (95% CI 46.4 to 49.3) of people with an OA code compared with 19.1% of
    non-cases.

    Across all categories of healthcare consumption we saw a similar pattern of
    excess use evident and rising steadily in the 4 years prior to the first
    recording of an OA Read code in the primary care EHR. Furthermore, we saw
    absence of an OA Read code in primary care even after joint replacement
    surgery for an OA indication in secondary care in over 50% of surgeries
    (25% recorded in primary care only after surgery, 28% not at all).

    *Conclusions*
    OA diagnosis coding in primary care was associated with excess healthcare
    consumption. Patterns of OA care were not entirely consistent with
    guideline-recommended practice. We saw strong evidence of under-reporting
    of OA (by Read code) in the primary care record; these findings may be
    biased downward via under-recording and late recording of OA diagnosis in
    primary care EHRs.
