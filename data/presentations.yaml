- conference: ISPOR Real-World Evidence Summit
  stub: ispor
  location: Tokyo
  date: 2025-09-28
  title:
    "Cost-effectiveness of primary and community care programmes for osteoarthritis:
    a modeling study using data from a multi-center national pilot program"
  note: poster presentation
  authors: Abbott JH, Wilson R
  published: _Value in Health Regional Issues_ 2025;49(1):101264
  doi: 10.1016/j.vhri.2025.101264
  abstract: |
    *Objectives*
    Musculoskeletal conditions are the leading cause of disability
    internationally as well as in New Zealand (NZ). Osteoarthritis (OA) is
    among the most common musculoskeletal conditions in adults, and causes a
    significant morbidity and economic burden. The NZ Government Ministry of
    Health initiated the Mobility Action Programme (MAP), a pragmatic pilot
    initiative to investigate what would be the benefits of delivering
    early-intervention, community-based programmes for people with
    musculoskeletal health conditions. This study aims to investigate the
    cost-effectiveness of intervention programmes for adults with OA.

    *Methods*
    We used real-world data from 17 providers across NZ delivering the MAP,
    with n=3,922 participants' outcomes to 1-year follow-up. As the MAP did not
    include a control group we used previously collected randomised controlled
    trial data for ‘usual care’ outcomes (n=51). Using the NZ-MOA
    state-transition microsimulation model, a simulated matching population
    cohort was run through two scenarios: (1) background 'usual care' assumed
    to be received in the absence of MAP participation, and (2) the MAP
    programme in addition usual care.

    *Results*
    Over the 1-year time horizon, incremental QALY gains were 0.03 (90% UI 0.02
    to 0.04) and incremental treatment costs were −\$793 (−\$4 214 to \$2 490) per
    MAP participant. Over the 15-year modelled time horizon QALY gains relative
    to usual care continued to accumulate, albeit at a decreasing rate,
    reaching 0.14 (0.10 to 0.18) per participant. Incremental healthcare costs
    were negative over all time horizons, reaching total cost savings of \$14
    555 (\$47 527 cost saving to \$17 167 cost increase) per participant over 15
    years. The incremental net monetary benefit, at willingness-to-pay of \$57
    500 per QALY, increased from \$2 341 (−\$944 to \$5 658) per participant over
    1-year horizon to \$22 441 (−\$9 227 to \$54 729) over 15 years.

    *Conclusions*
    The MAP increased health-related quality of life and was cost-saving
    compared with usual care for adults with OA.
- conference: ISPOR Real-World Evidence Summit
  stub: ispor
  location: Tokyo
  date: 2025-09-28
  title:
    "The long-term effects of opioid use before total joint replacement surgery:
    a dose-response trial emulation using New Zealand linked administrative data"
  note: poster presentation
  authors: Wilson R, Pryymachenko Y, Choong P, Dowsey M, Abbott JH
  published: _Value in Health Regional Issues_ 2025;49(1):101429
  doi: 10.1016/j.vhri.2025.101429
  abstract: |
    *Objectives*
    To determine the relationship between opioid use before joint replacement
    surgery and long-term postoperative outcomes.

    *Methods*
    This was a trial emulation study using linked administrative data.
    Participants included all patients who underwent joint replacement surgery
    for osteoarthritis in the New Zealand public healthcare system between July
    2011 and June 2017. We assigned patients to treatment groups based on their
    opioid prescribing over the 3 months before surgery: none (control group),
    and equal quartiles of the observed distribution of the total morphine
    equivalent opioid dose. Inverse probability of treatment weighting was used
    to achieve between-group balance in baseline confounders. Outcomes measured
    over 6-year follow-up from the date of surgery included public healthcare
    utilisation and costs, employment and income, and adverse events including
    mortality, opioid overdose, and revision surgery.

    *Results*
    We included 26,064 patients. Participants with preoperative opioid
    prescribing had more hospitalisations, ED visits, pharmaceutical
    prescriptions, and opioid prescriptions, and higher total opioid dose and
    public healthcare costs, over 6-year follow-up than those in the no-opioid
    control group. There was little evidence of a dose-response relationship in
    these effects, with the exception of pharmaceutical—and particularly
    opioid—prescriptions. Those in the highest opioid dose group had lower
    income and employment rates, while no effect on these outcomes was seen in
    the lower opioid use groups. Most adverse events were more common in the
    treatment groups than in the control group, but these differences were
    generally not statistically significant.

    *Conclusions*
    Opioid use before joint replacement surgery is associated with worse
    outcomes over 6-year postoperative follow-up. Most of these negative
    impacts were seen at both low and high levels of preoperative opioid use,
    suggesting that low-dose opioid prescribing is unlikely to significantly
    mitigate the harms of preoperative opioid use. Efforts should be made to
    develop appropriate alternatives to opioid analgesics for people awaiting
    joint replacement surgery.
- conference: ISPOR Real-World Evidence Summit
  stub: ispor
  location: Tokyo
  date: 2025-09-28
  title:
    Association between barriers to accessing general practitioners and emergency
    department visits in New Zealand
  note: poster presentation
  authors:
    Lim YW, Gayed M, Christopherson R, Caya R, Gaspar Fernandes L, Pierobon
    A, Pryymachenko Y, Magin D, Abbott JH, Wilson R
  published: _Value in Health Regional Issues_ 2025;49(1):101203
  doi: 10.1016/j.vhri.2025.101203
  abstract: |
    *Objectives*
    The growth in the number of emergency department (ED) presentations has
    been a concern for health systems globally. Barriers to accessing general
    practitioners (GPs) may be associated with the use of ED. This study aims
    to investigate the associations between barriers to visiting GPs and the
    rate of ED visits in New Zealand (NZ).

    *Methods*
    We used data from repeated waves of the New Zealand Health Survey, a large
    national survey of a representative sample of the NZ population, covering
    the years 2011 to 2022. Barriers were measured by whether a respondent
    reported that there was a time in which they had a health problem but did
    not visit a GP due to cost, lack of transport, waiting time to get an
    appointment, owing money to the practice, dislike of the GP, inability to
    get time off work, lack of care for dependent children, or lack of a
    supporter or interpreter. The association between each barrier and the
    number of visits to an ED was estimated by linear regression models,
    adjusting for age, gender, ethnicity, socioeconomic status, and health
    conditions.

    *Results*
    Barriers to accessing GPs due to cost (adjusted mean difference 0.16 ED
    visits/year, 95%CI 0.14 to 0.17), lack of transport (0.50, 95%CI 0.46 to
    0.53), waiting time to get an appointment (0.11, 95%CI 0.02 to 0.20), and
    owing money to the practice (1.39, 95%CI 1.14 to 1.63) were significantly
    associated with the number of visits made to an ED. Translating these
    findings to the NZ adult population, this represents potentially avoidable
    expenditures of NZ\$50 million, NZ\$37 million, NZ\$31 million, and NZ\$51
    million, respectively.

    *Conclusions*
    Developing policies aimed at improving access to GP services may reduce ED
    visits and alleviate the personal, health system, and societal burden of
    avoidable ED use.
